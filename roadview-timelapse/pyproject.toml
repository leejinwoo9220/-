[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rvt"
version = "0.1.0"
description = "Road-view time-lapse: era alignment, MiniMax H3 (Sogni) generation and sign-exact finishing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-contrib-python-headless>=4.8", "pillow>=10"]

[tool.setuptools]
packages = ["rvt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
